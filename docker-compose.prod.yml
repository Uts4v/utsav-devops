
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend1:
    image: ghcr.io/uts4v/utsav-devops-backend1:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  backend2:
    image: ghcr.io/uts4v/utsav-devops-backend2:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: ghcr.io/uts4v/utsav-devops-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
