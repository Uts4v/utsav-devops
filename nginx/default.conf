
server {
    listen 80;

    root /usr/share/nginx/html;
    index signup.html;

    location = /signup {
        proxy_pass http://backend1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /login {
        proxy_pass http://backend2:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /dashboard {
        proxy_pass http://backend2:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
        proxy_pass http://backend2:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
