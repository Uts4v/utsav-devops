name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend1 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend1
          load: true
          tags: utsav-backend1:${{ github.sha }}

      - name: Build backend2 image
        uses: docker/build-push-action@v6
        with:
          context: ./backend2
          load: true
          tags: utsav-backend2:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: utsav-frontend:${{ github.sha }}

      - name: Scan backend1 image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: utsav-backend1:${{ github.sha }}
          trivy-config: trivy.yaml
          hide-progress: true

      - name: Scan backend2 image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: utsav-backend2:${{ github.sha }}
          trivy-config: trivy.yaml
          skip-setup-trivy: true
          hide-progress: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: utsav-frontend:${{ github.sha }}
          trivy-config: trivy.yaml
          skip-setup-trivy: true
          hide-progress: true

      - name: Tag and push images
        run: |
          docker tag utsav-backend1:${{ github.sha }} ghcr.io/uts4v/utsav-devops-backend1:latest
          docker tag utsav-backend1:${{ github.sha }} ghcr.io/uts4v/utsav-devops-backend1:${{ github.sha }}
          docker tag utsav-backend2:${{ github.sha }} ghcr.io/uts4v/utsav-devops-backend2:latest
          docker tag utsav-backend2:${{ github.sha }} ghcr.io/uts4v/utsav-devops-backend2:${{ github.sha }}
          docker tag utsav-frontend:${{ github.sha }} ghcr.io/uts4v/utsav-devops-frontend:latest
          docker tag utsav-frontend:${{ github.sha }} ghcr.io/uts4v/utsav-devops-frontend:${{ github.sha }}
          docker push ghcr.io/uts4v/utsav-devops-backend1:latest
          docker push ghcr.io/uts4v/utsav-devops-backend1:${{ github.sha }}
          docker push ghcr.io/uts4v/utsav-devops-backend2:latest
          docker push ghcr.io/uts4v/utsav-devops-backend2:${{ github.sha }}
          docker push ghcr.io/uts4v/utsav-devops-frontend:latest
          docker push ghcr.io/uts4v/utsav-devops-frontend:${{ github.sha }}
