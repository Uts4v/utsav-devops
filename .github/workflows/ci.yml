name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend1
        uses: docker/build-push-action@v6
        with:
          context: ./backend1
          push: true
          tags: |
            ghcr.io/uts4v/utsav-devops-backend1:latest
            ghcr.io/uts4v/utsav-devops-backend1:${{ github.sha }}

      - name: Build and push backend2
        uses: docker/build-push-action@v6
        with:
          context: ./backend2
          push: true
          tags: |
            ghcr.io/uts4v/utsav-devops-backend2:latest
            ghcr.io/uts4v/utsav-devops-backend2:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/uts4v/utsav-devops-frontend:latest
            ghcr.io/uts4v/utsav-devops-frontend:${{ github.sha }}