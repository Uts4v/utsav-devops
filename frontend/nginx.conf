
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index login.html;

    location = /signup {
        proxy_pass http://backend1-test-container:5000;
    }

    location = /login {
        proxy_pass http://login-backend2:5000;
    }

    location = /logout {
        proxy_pass http://login-backend2:5000;
    }

    location = /dashboard {
        proxy_pass http://login-backend2:5000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
