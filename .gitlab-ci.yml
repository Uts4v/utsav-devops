
stages:
  - build

build-and-push:
  stage: build
  tags:
    - local-shell

  script:
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - docker build -t "$CI_REGISTRY_IMAGE/backend1:$CI_COMMIT_SHORT_SHA" ./backend1
    - docker push "$CI_REGISTRY_IMAGE/backend1:$CI_COMMIT_SHORT_SHA"

    - docker build -t "$CI_REGISTRY_IMAGE/backend2:$CI_COMMIT_SHORT_SHA" ./backend2
    - docker push "$CI_REGISTRY_IMAGE/backend2:$CI_COMMIT_SHORT_SHA"

    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        for service in backend1 backend2 frontend; do
          docker tag "$CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE/$service:latest"
          docker push "$CI_REGISTRY_IMAGE/$service:latest"
        done
      fi

  rules:
    - if: '$CI_COMMIT_BRANCH'
