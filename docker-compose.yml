
services:
  db:
    image: postgres:16
    container_name: project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - utsav-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend1:
    build: ./backend1
    container_name: backend1-test-container
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - utsav-network

  backend2:
    build: ./backend2
    container_name: login-backend2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - utsav-network

  frontend:
    build: ./frontend
    container_name: frontend-container
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
    networks:
      - utsav-network

volumes:
  postgres_data:
    external: true
    name: utsav_postgres_data

networks:
  utsav-network:
    external: true
