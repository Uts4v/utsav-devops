services:
  caddy:
    image: caddy:2
    container_name: project-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

  nginx:
    image: nginx:latest
    container_name: project-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2

  backend1:
    build: ./backend1
    container_name: project-backend1
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: signup_login
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend2:
    build: ./backend2
    container_name: project-backend2
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: signup_login
      DB_USER: appuser
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signup_login
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d signup_login"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config: